# Test APK workflow: triggers on push to main or manual dispatch.
name: CI

on:
  push:
    branches: [main]
    paths:
      - 'src/TiktokStreakSaver/**'
      - 'global.json'
      - 'global.ci.json'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'src/TiktokStreakSaver/**'
      - 'global.json'
      - 'global.ci.json'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_VERSION: '9.0.203'
  PROJECT_PATH: src/TiktokStreakSaver/TiktokStreakSaver.csproj

jobs:
  build:
    name: Build MAUI
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply CI SDK pin
        run: cp global.ci.json global.json

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          global-json-file: global.json

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: 17

      - name: Restore workloads
        run: dotnet workload restore ${{ env.PROJECT_PATH }}

      - name: Build APK (Debug)
        run: >
          dotnet build ${{ env.PROJECT_PATH }}
          -f net9.0-android
          -c Debug
          -p:SkipIosNativeBuild=true
          -p:TargetFrameworks=net9.0-android
          -p:EmbedAssembliesIntoApk=true
          -p:AndroidPackageFormats=apk

      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: streak-saver-debug-apk
          path: src/TiktokStreakSaver/bin/Debug/net9.0-android/**/*.apk
          if-no-files-found: error
          retention-days: 14
