# Test APK workflow: triggers on push to main or manual dispatch.
name: CI

on:
  push:
    branches: [main]
    paths:
      - 'src/TiktokStreakSaver/**'
      - 'global.json'
      - 'global.ci.json'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'src/TiktokStreakSaver/**'
      - 'global.json'
      - 'global.ci.json'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_VERSION: '9.0.203'
  PROJECT_PATH: src/TiktokStreakSaver/TiktokStreakSaver.csproj

jobs:
  build:
    name: Build MAUI
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply CI SDK pin
        run: cp global.ci.json global.json

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          global-json-file: global.json

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: 17

      - name: Restore workloads
        run: dotnet workload restore ${{ env.PROJECT_PATH }}

      # Configure once in Settings > Secrets and variables > Actions:
      # STREAK_KEYSTORE_BASE64: base64 of a private Android .jks keystore
      # STREAK_KEYSTORE_PASSWORD: keystore/key password (same for both)
      # STREAK_KEY_ALIAS: alias in that keystore
      # Keep the original .jks backed up privately; losing it prevents updates.
      - name: Restore persistent signing key
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.STREAK_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.STREAK_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.STREAK_KEY_ALIAS }}
        run: |
          set -euo pipefail
          if [[ -z "$KEYSTORE_B64" || -z "$KEYSTORE_PASSWORD" || -z "$KEY_ALIAS" ]]; then
            echo "::error::Configure STREAK_KEYSTORE_BASE64, STREAK_KEYSTORE_PASSWORD and STREAK_KEY_ALIAS in GitHub Actions Secrets before building."
            exit 1
          fi
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/streaksaver.jks"
          chmod 600 "$RUNNER_TEMP/streaksaver.jks"
          keytool -list -keystore "$RUNNER_TEMP/streaksaver.jks" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          echo "ANDROID_KEYSTORE=$RUNNER_TEMP/streaksaver.jks" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "ANDROID_SIGNING_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"

      - name: Build APK (Debug, persistent signature)
        shell: bash
        run: |
          set -euo pipefail
          # GitHub run numbers increase across new workflow runs. A fixed
          # positive offset keeps the versionCode ahead of old version 5.
          version_code=$((1000 + GITHUB_RUN_NUMBER))
          dotnet build "${{ env.PROJECT_PATH }}" \
            -f net9.0-android \
            -c Debug \
            -p:SkipIosNativeBuild=true \
            -p:TargetFrameworks=net9.0-android \
            -p:EmbedAssembliesIntoApk=true \
            -p:AndroidPackageFormats=apk \
            -p:ApplicationVersion="$version_code" \
            -p:AndroidKeyStore=true \
            -p:AndroidSigningKeyStore="$ANDROID_KEYSTORE" \
            -p:AndroidSigningKeyAlias="$ANDROID_KEY_ALIAS" \
            -p:AndroidSigningKeyPass="env:ANDROID_SIGNING_PASSWORD" \
            -p:AndroidSigningStorePass="env:ANDROID_SIGNING_PASSWORD"

      - name: Select signed APK
        shell: bash
        run: |
          set -euo pipefail
          apk="$(find src/TiktokStreakSaver/bin/Debug/net9.0-android -type f -name '*-Signed.apk' -print -quit)"
          if [[ -z "$apk" ]]; then
            echo "::error::No signed APK found. Available APK files:"
            find src/TiktokStreakSaver/bin/Debug/net9.0-android -type f -name '*.apk' -print
            exit 1
          fi
          mkdir -p output
          cp "$apk" output/StreakSaver-Debug-Signed.apk
          echo "Selected signed APK: $apk"
          ls -lh output/StreakSaver-Debug-Signed.apk

      - name: Upload signed APK without ZIP
        uses: actions/upload-artifact@v7
        with:
          path: output/StreakSaver-Debug-Signed.apk
          archive: false
          if-no-files-found: error
          retention-days: 14
